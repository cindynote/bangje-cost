<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>방제 원가계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 열 모바일 우선 · 상단 고정 합계 바 + 탭 · 입력칸은 엑셀 입력칸처럼 옅은 노란 바탕 */
:root{
  --bg:#F3F5F3; --surface:#FFFFFF; --sunk:#EAEEEB; --ink:#18211D; --muted:#5B6862; --line:#D5DDD8;
  --accent:#2C6A4E; --accent-ink:#FFFFFF; --accent-soft:#DCEBE3;
  --input:#FCF8E6; --input-line:#E2D79E; --warn:#A4471F; --warn-soft:#F7E6DC;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1A221E; --sunk:#222C27; --ink:#E6ECE8; --muted:#9AA8A1; --line:#2F3B35;
  --accent:#6FBF97; --accent-ink:#0E1512; --accent-soft:#21362C;
  --input:#2A2818; --input-line:#5A532B; --warn:#F0A57F; --warn-soft:#3A2419; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A221E; --sunk:#222C27; --ink:#E6ECE8; --muted:#9AA8A1; --line:#2F3B35;
  --accent:#6FBF97; --accent-ink:#0E1512; --accent-soft:#21362C;
  --input:#2A2818; --input-line:#5A532B; --warn:#F0A57F; --warn-soft:#3A2419; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
h1{font-family:var(--f-display);font-size:1.3rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{font-size:.78rem;color:var(--muted);margin:0}
.total{text-align:right;min-width:0}
.total .lbl{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.total .val{font-family:var(--f-num);font-weight:500;font-size:1.15rem;font-variant-numeric:tabular-nums;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs button{flex:1 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{padding-block:16px 48px;display:grid;gap:16px}
section.panel{display:grid;gap:14px}
h2{font-family:var(--f-display);font-size:1.1rem;margin:4px 0 0}
.note{font-size:.8rem;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-h strong{font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
label.f{display:grid;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
label.f span.u{color:var(--muted)}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--input);border:1px solid var(--input-line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-num);font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.samples{display:grid;gap:6px}
.sample{display:grid;grid-template-columns:2.2em 1fr 1fr 2.2em;gap:6px;align-items:center}
.sample .no{font-family:var(--f-num);font-size:.8rem;color:var(--muted);text-align:center}
.calc{display:flex;flex-wrap:wrap;gap:6px 18px;background:var(--sunk);border-radius:7px;padding:8px 10px;font-size:.82rem}
.calc b{font-family:var(--f-num);font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.calc span{color:var(--muted)}
button.btn{font:inherit;font-size:.88rem;font-weight:500;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn.ghost{border-style:dashed;background:transparent}
button.icon{border:none;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px 8px;border-radius:6px}
button.icon:hover{color:var(--warn);background:var(--warn-soft)}
button:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--input-line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:.85rem;border:none;background:var(--input);color:var(--ink);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
details>summary{cursor:pointer;font-weight:600;font-size:.95rem}
details[open]>summary{margin-bottom:12px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.03em;background:var(--sunk)}
td.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
td.r{color:var(--muted);font-size:.78rem}
tr.sub td{background:var(--sunk);font-weight:600}
tr.tot td{background:var(--accent-soft);font-weight:700}
tr.grp td:first-child{font-weight:600}
.pill{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.84rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:.82rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.86rem}
.kv b{font-family:var(--f-num);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem}
.siteline{color:var(--accent);font-weight:500}
.site{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.site .meta{font-size:.78rem;color:var(--muted)}
.site .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.site .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.site.cur{border-color:var(--accent)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.msg{font-size:.84rem;color:var(--warn);min-height:1.2em}
@media (max-width:420px){.grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="row">
      <div>
        <h1>방제 원가계산기</h1>
        <p class="sub">수목진료 표준품셈(2025.6.) 2-1 방제제 살포</p>
        <p class="sub siteline" id="siteLine"></p>
      </div>
      <div class="total">
        <div class="lbl">합계 (부가세 포함)</div>
        <div class="val" data-o="grand">-</div>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="sites" id="tab-sites">현장</button>
      <button role="tab" data-tab="trees" id="tab-trees">수목</button>
      <button role="tab" data-tab="chems" id="tab-chems">약제</button>
      <button role="tab" data-tab="diag" id="tab-diag">진단</button>
      <button role="tab" data-tab="base" id="tab-base">기준</button>
      <button role="tab" data-tab="result" id="tab-result">결과</button>
    </nav>
  </div>
</header>

    pairs.forEach(([x,y])=>{x=num(x);y=num(y);if(x>0&&y>0)cnt++;sum+=x*y});

    const vol=(per==null||!g.type||num(g.n)===0)?0:per*ap*num(g.n);
    return{cnt,avg,per,ap,vol};
  });
  r.shrubs=S.shrubs.map(s=>num(s.area)===0?0:num(s.area)*num(b.shrubL));
  r.treeOnce=r.trees.reduce((a,t)=>a+t.vol,0);
  r.shrubOnce=r.shrubs.reduce((a,v)=>a+v,0);
  const k=num(S.info.rounds)*num(S.info.adj);
  r.treeTot=r.treeOnce*k; r.shrubTot=r.shrubOnce*k;
  r.treeQ=R2(r.treeTot/100); r.shrubQ=R2(r.shrubTot/100);
  r.qty=r.treeQ+r.shrubQ;
  r.chems=S.chems.map(c=>{const d=num(c.dil);const use=d?100000/d:null;const cost=(use==null||num(c.size)===0)?0:use*num(c.price)/num(c.size);return{use,cost}});
  r.chemSum=r.chems.reduce((a,c)=>a+c.cost,0);
  /* 일위대가 100ℓ당 */
  const sg=1+num(b.surge.high)+num(b.surge.far);
  const u={};
  u.chem=T(r.chemSum); u.misc=T(u.chem*num(b.misc));
  u.qDoc=num(b.pum.doc)*sg; u.qTech=num(b.pum.tech)*sg; u.qLab=num(b.pum.lab)*sg;
  u.doc=T(u.qDoc*num(b.wage.doc)); u.tech=T(u.qTech*num(b.wage.tech)); u.lab=T(u.qLab*num(b.wage.lab));
  u.spr=T(num(b.pum.spr)*num(b.equip.spr)); u.car=T(num(b.pum.car)*num(b.equip.car));
  u.tool=T((u.doc+u.tech+u.lab)*num(b.tool));
  u.mat=u.chem+u.misc; u.labor=u.doc+u.tech+u.lab; u.exp=u.spr+u.car+u.tool; u.mach=u.spr+u.car;
  u.total=u.mat+u.labor+u.exp; r.u=u;
  /* 내역서 */
  const line=q=>{const F=T(q*u.mat),H=T(q*u.labor),J=T(q*u.exp),N=T(q*u.mach),P=T(q*u.chem);return{q,F,H,J,N,O:J-N,P,Q:F-P,L:F+H+J}};
  r.lt=line(r.treeQ); r.ls=line(r.shrubQ);
  const L={};["F","H","J","N","O","P","Q","L"].forEach(c=>L[c]=r.lt[c]+r.ls[c]); r.L=L;
  /* 진단비 */
  const dg=S.diag, si=SCALES.indexOf(dg.scale), sc=si<0?1:num(dg.scales[si]);
  const d={sc};
  d.f10=T(0.5*num(b.wage.doc)*sc); d.f11=T(0.5*num(b.wage.doc)*sc); d.lab=d.f10+d.f11;
  d.travel=T(num(dg.days)*num(dg.travel)); d.cert=T(num(dg.cert)); d.anal=T(num(dg.anal)); d.equip=T(num(dg.equip)); d.etc=T(num(dg.etc));
  d.exp=d.travel+d.cert+d.anal+d.equip+d.etc; d.s3=d.lab+d.exp;
  d.gm=T(d.s3*num(dg.gm)); d.pr=T((d.s3+d.gm)*num(dg.pr)); d.once=d.s3+d.gm+d.pr; d.total=d.once*num(dg.count);
  r.d=d;
  /* 원가계산서 */
  const pi=PERIODS.indexOf(b.period), pr=pi<0?[0,0]:b.periods[pi], rt=b.rates, c={};
  c.rInd=num(pr[0]); c.rEtc=num(pr[1]);
  c.dMat=L.P; c.iMat=L.Q; c.scrap=num(b.scrap); c.mat=c.dMat+c.iMat-c.scrap;
  c.dLab=L.H; c.iLab=T(c.dLab*c.rInd); c.lab=c.dLab+c.iLab;
  c.mach=L.N; c.tool=L.O;
  c.ins=T(c.lab*num(rt.ins)); c.emp=T(c.lab*num(rt.emp));
  const on4=b.ins4==="Y";
  c.hea=on4?T(c.dLab*num(rt.hea)):0; c.ltc=on4?T(c.hea*num(rt.ltc)):0; c.pen=on4?T(c.dLab*num(rt.pen)):0;
  c.safe=b.safeOn==="Y"?T((c.mat+c.dLab)*num(rt.safe)):0;
  c.etc=T((c.mat+c.lab)*c.rEtc);
  c.env=T((c.mat+c.dLab+c.mach+c.tool)*num(rt.env));
  c.exp=c.mach+c.tool+c.ins+c.emp+c.hea+c.ltc+c.pen+c.safe+c.etc+c.env;
  c.sum=c.mat+c.lab+c.exp;
  c.gm=T(c.sum*num(rt.gm)); c.pr=T((c.lab+c.exp+c.gm)*num(rt.pr));
  c.cost=c.sum+c.gm+c.pr; c.dmg=T(c.cost*num(rt.dmg));
  c.diag=dg.on==="Y"?d.total:0;
  c.supply=Math.floor((c.cost+c.dmg+c.diag)/1000)*1000;
  c.vat=T(c.supply*num(rt.vat)); c.grand=c.supply+c.vat;
  r.c=c; return r;
}

function fillWorkbook(wb,S){
  const put=(sh,a,v)=>{wb.getWorksheet(sh).getCell(a).value=(v===""||v==null)?null:v};
  const b=S.base, B="기초자료";
  put(B,"C5",b.wage.doc);put(B,"C6",b.wage.tech);put(B,"C7",b.wage.lab);
  ["doc","tech","lab","spr","car"].forEach((k,i)=>put(B,"C"+(10+i),b.pum[k]));
  put(B,"C18",b.equip.spr);put(B,"C19",b.equip.car);
  put(B,"C23",b.surge.high);put(B,"C24",b.surge.far);
  put(B,"C29",b.misc);put(B,"C30",b.tool);
  b.apply.forEach((v,i)=>put(B,"C"+(34+i),v)); put(B,"C38",b.shrubL);
  const rm={C43:"ins",C44:"emp",C45:"hea",C46:"ltc",C47:"pen",C48:"safe",C50:"env",C51:"gm",C52:"pr",C53:"dmg",C54:"vat"};
  Object.entries(rm).forEach(([a,k])=>put(B,a,b.rates[k]));
  put(B,"C58",b.ins4);put(B,"C59",b.safeOn);put(B,"C60",b.period);
  b.periods.forEach((p,i)=>{put(B,"C"+(63+i),p[0]);put(B,"D"+(63+i),p[1])});
  const H="수목현황";
  put(H,"C3",S.info.name);put(H,"C4",S.info.rounds);put(H,"C5",S.info.adj);
  const sc="GHIJKLMNOP";
  for(let i=0;i<LIMIT.trees;i++){
    const row=10+i, g=S.trees[i];
    put(H,"B"+row,g?g.loc:null);put(H,"C"+row,g?g.sp:null);put(H,"D"+row,g?g.type:null);put(H,"F"+row,g?num(g.n)||null:null);
    for(let k=0;k<LIMIT.samples;k++){const p=g&&g.s[k];put(H,sc[2*k]+row,p?num(p[0])||null:null);put(H,sc[2*k+1]+row,p?num(p[1])||null:null)}
  }
  for(let i=0;i<LIMIT.shrubs;i++){
    const row=24+i, s=S.shrubs[i];
    put(H,"B"+row,s?s.loc:null);put(H,"C"+row,s?s.sp:null);put(H,"D"+row,s?num(s.area)||null:null);
  }
  const Y="약제";
  for(let i=0;i<LIMIT.chems;i++){
    const row=5+i, c=S.chems[i];
    put(Y,"B"+row,c?c.name:null);put(Y,"C"+row,c?c.kind:null);
    put(Y,"D"+row,c?num(c.dil)||null:null);put(Y,"E"+row,c?num(c.size)||null:null);put(Y,"F"+row,c?num(c.price)||null:null);put(Y,"I"+row,null);
  }
  const D="진단비", dg=S.diag;
  put(D,"C4",dg.on);put(D,"C5",dg.count);put(D,"C6",dg.scale);
  put(D,"C13",dg.days);put(D,"E13",dg.travel);put(D,"E14",dg.cert);put(D,"E15",dg.anal);put(D,"E16",dg.equip);put(D,"E17",dg.etc);
  put(D,"C20",dg.gm);put(D,"C21",dg.pr);
  dg.scales.forEach((v,i)=>put(D,"C"+(28+i),v));
  put("원가계산서","C7",b.scrap);
  wb.calcProperties=wb.calcProperties||{}; wb.calcProperties.fullCalcOnLoad=true;
  return wb;
}
if(typeof module!=="undefined")module.exports={defaults,calc,fillWorkbook,TYPES,PERIODS,SCALES,LIMIT};

const VIEWS={trees:vTrees,chems:vChems,diag:vDiag,base:vBase,result:vResult};

/* ===== 출력 갱신 ===== */
function outputs(){
  const r=calc(S), o={grand:won(r.c.grand)+"원"};
  r.trees.forEach((t,i)=>{o["t"+i+"ap"]=pct(t.ap,0);o["t"+i+"avg"]=t.avg==null?"-":L1(t.avg);o["t"+i+"per"]=L1(t.per);o["t"+i+"vol"]=L1(t.vol)});
  r.shrubs.forEach((v,i)=>o["s"+i+"vol"]=L1(v));
  Object.assign(o,{treeOnce:L1(r.treeOnce),treeTot:L1(r.treeTot),treeQ:r.treeQ.toFixed(2),shrubOnce:L1(r.shrubOnce),shrubTot:L1(r.shrubTot),shrubQ:r.shrubQ.toFixed(2),once:L1(r.treeOnce+r.shrubOnce),tot:L1(r.treeTot+r.shrubTot),qty:r.qty.toFixed(2)});
  r.chems.forEach((c,i)=>{o["c"+i+"use"]=c.use==null?"-":L1(c.use);o["c"+i+"cost"]=won(c.cost)});
  o.chemSum=won(r.chemSum)+"원"; o.uMisc=won(r.u.misc)+"원";
  const d=r.d; Object.assign(o,{dSc:pct(d.sc,0),dF10:won(d.f10)+"원",dF11:won(d.f11)+"원",dS3:won(d.s3)+"원",dGm:won(d.gm)+"원",dPr:won(d.pr)+"원",dOnce:won(d.once)+"원",dTotal:won(d.total)+"원"});
  o.rInd=pct(r.c.rInd); o.rEtc=pct(r.c.rEtc);
  document.querySelectorAll("[data-o]").forEach(el=>{const k=el.dataset.o;if(k in o)el.textContent=o[k]});
}
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  document.getElementById("app").innerHTML=VIEWS[tab]();
  outputs(); if(tab==="result")bindExport();
}

/* ===== 이벤트 ===== */
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;tab=b.dataset.tab;try{localStorage.setItem(TABKEY,tab)}catch(err){}render();window.scrollTo({top:0})});
const app=document.getElementById("app");
app.addEventListener("input",e=>{
  const el=e.target, k=el.dataset.k; if(!k)return;
  let v=el.value;
  if(el.dataset.num){v=v===""?"":Number(v); if(el.dataset.pct&&v!=="")v=+(v/100).toPrecision(12)}
  set(k,v); save(); outputs();
});
app.addEventListener("change",e=>{if(e.target.tagName==="SELECT"){save();outputs()}});
app.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.dataset.yn){set(t.dataset.yn,t.dataset.v);save();render();return}
  if(t.dataset.add){const k=t.dataset.add;
    if(k==="trees")S.trees.push({loc:"",sp:"",type:"단목",n:"",s:[["",""],["",""],["",""]]});
    if(k==="shrubs")S.shrubs.push({loc:"",sp:"",area:""});
    if(k==="chems")S.chems.push({name:"",kind:"",dil:"",size:"",price:""});
    save();render();return}
  if(t.dataset.addsample){S.trees[+t.dataset.addsample].s.push(["",""]);save();render();return}
  if(t.dataset.del){const ks=t.dataset.del.split(".");const idx=+ks.pop();const arr=ks.reduce((o,k)=>o[k],S);arr.splice(idx,1);save();render();return}
  if(t.id==="resetAsk"){document.getElementById("resetBox").innerHTML=`<span>정말 되돌릴까요?</span><button class="btn primary" id="resetYes">되돌리기</button><button class="btn" id="resetNo">취소</button>`;return}
  if(t.id==="resetNo"){render();return}
  if(t.id==="resetYes"){S=defaults();save();render();return}
});

/* ===== 엑셀 내보내기 ===== */
const dlP=(window.claude&&window.claude.use)?window.claude.use("downloads").catch(()=>null):Promise.resolve(null);
function bindExport(){
  const btn=document.getElementById("xlsx"), st=document.getElementById("xstatus");
  if(!btn)return;
  btn.onclick=async()=>{
    btn.disabled=true; st.textContent="엑셀 파일을 만드는 중이에요.";
    try{
      const dl=await dlP;
      if(!window.ExcelJS)throw new Error("lib");
      const bin=atob(document.getElementById("tpl").textContent.trim()); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      const wb=new ExcelJS.Workbook(); await wb.xlsx.load(bytes.buffer);
      fillWorkbook(wb,S);
      const buf=await wb.xlsx.writeBuffer();
      const fname=(String(S.info.name||"방제").replace(/[\\/:*?"<>|]/g,"").trim()||"방제")+"_원가계산서.xlsx";
      const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      if(dl){await dl.save({filename:fname,data:blob})}
      else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
      st.textContent="저장했어요. 엑셀에서 열면 수식이 다시 계산돼요.";
    }catch(err){
      const code=err&&err.code;
      st.textContent=code==="declined"?"저장을 취소했어요.":code==="rate_limited"?"저장 창이 이미 열려 있어요. 잠시 후 다시 눌러 주세요.":"엑셀 파일을 만들지 못했어요. 페이지를 새로 고친 뒤 다시 시도해 주세요.";
    }finally{btn.disabled=false}
  };
}
